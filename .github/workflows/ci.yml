name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # Windows runner: attribute files use Windows code pages and CRLF line endings
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TeklaHelper.DrawingAttribute.slnx

      - name: Build
        run: dotnet build TeklaHelper.DrawingAttribute.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test TeklaHelper.DrawingAttribute.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/TeklaHelper.DrawingAttribute/TeklaHelper.DrawingAttribute.csproj -c Release --no-build -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: nuget-package
          path: artifacts/*
          if-no-files-found: error
